name: Validate Site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Validate config and generated assets
        run: |
          npm run validate
